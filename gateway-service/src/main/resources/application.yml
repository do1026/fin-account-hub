server:
  port: 8000

spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-route
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/auth/**
            - id: account-route
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/accounts/**
            - id: transfer-route
              uri: lb://TRANSFER-SERVICE
              predicates:
                - Path=/api/transfers/**
            - id: notification-route
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "${FRONTEND_ORIGIN:http://localhost:3000}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoint:
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway